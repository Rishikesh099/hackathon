<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Assessment | AI Learning Platform</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>

    <header>
      <div class="nav-container">
        <a href="dashboard.html" class="brand"
          ><div class="brand-icon">🧠</div>
          LearnTrace AI</a
        >
        <ul class="nav-links">
          <li><a href="dashboard.html">Back to Dashboard</a></li>
        </ul>
      </div>
    </header>

    <div class="main-wrapper" style="max-width: 800px">
      <div class="section-title">
        <h2>Diagnostic Assessment</h2>
        <p>
          Select an answer and briefly explain your reasoning for every
          question.
        </p>
      </div>

      <form id="assessment-form">
        <div id="questions-container">Loading questions...</div>
        <button
          type="submit"
          class="submit-btn"
          id="submit-btn"
          style="display: none; margin-top: 1.5rem"
        >
          Submit Assessment
        </button>
      </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/assessment.js"></script>
  </body>
</html>
